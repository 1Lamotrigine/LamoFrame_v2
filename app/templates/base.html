{% load static %}<!doctype html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}LamoFrame{% endblock %}</title>
  <meta name="description" content="Конструктор сайтов на свободном холсте — соберите многостраничный сайт и скачайте готовый ZIP.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234F46E5'/%3E%3Cpath d='M8 23 14 8l4 9 2-5 4 11' fill='none' stroke='white' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v={{ ASSET_VERSION }}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}?v={{ ASSET_VERSION }}">
  <script type="importmap">
    {
      "imports": {
        {% get_static_prefix as STATIC_PREFIX %}{% for name in MODULE_NAMES %}"{{ STATIC_PREFIX }}js/{{ name }}": "{{ STATIC_PREFIX }}js/{{ name }}?v={{ ASSET_VERSION }}"{% if not forloop.last %},{% endif %}{% endfor %}
      }
    }
  </script>
  {% block styles %}{% endblock %}
  <script>
    (function () {
      try {
        var t = localStorage.getItem('sb-theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark';
        }
      } catch (e) {}
      // Синхронизируем тему между вкладками.
      window.addEventListener('storage', function (event) {
        if (event.key !== 'sb-theme' || !event.newValue) return;
        document.documentElement.dataset.theme = event.newValue;
        window.dispatchEvent(new CustomEvent('sb-theme-change', { detail: event.newValue }));
      });
    })();
  </script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <script>
    window.BUILDER = {
      staticUrl: "{% get_static_prefix %}",
      iconsUrl: "{% static 'icons.svg' %}?v={{ ASSET_VERSION }}",
      assetVersion: "{{ ASSET_VERSION }}",
      csrfToken: "{{ csrf_token }}"
    };
  </script>
  {% block content %}{% endblock %}
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
</body>
</html>
